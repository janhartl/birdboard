required_players = ["jokicni01"]
text = """
Jokić gives you maximum flexibility. He supplies elite assists from center and contributes everywhere, leaving very few structural weaknesses.

Use that flexibility to add blocks, guard defense, threes, high FT-volume guards and athletic wings.

