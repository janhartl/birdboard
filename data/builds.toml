[[builds]]
id = "wembanyama"
title = "Victor Wembanyama Build"
required_players = ["wembavi01"]
text = """
Wembanyama creates the strongest blocks and big-man foundation in the league. He already gives you elite blocks, rebounds, FG%, stocks and center scarcity.

Spend the rest of the foundation on guard production: assists, threes, FT%, guard steals and low turnovers where possible.

Do not waste money building an unnecessary advantage in blocks while losing assists and threes. Avoid premium blocks-only centers and another $30+ big unless that player also adds elite assists or scoring. Once the guard foundation is established, chase upside.
"""
target_players = [
    "whitede01", # Derrick White
    "garlada01", # Darius Garland
    "sheppre01", # Reed Sheppard
    "wallaca01", # Cason Wallace
    "pritcpa01", # Payton Pritchard
