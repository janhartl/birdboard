[package]
name = "birdboard"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
csv = "1.4.0"
fuzzy-matcher = "0.3.7"
toml = "1.1.4"
chrono = "0.4"
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
